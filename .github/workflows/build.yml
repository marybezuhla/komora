name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

# Stale pull request runs are stopped. On main a run is never stopped once started; a newer push
# may replace one still waiting to start, and the newer version is then the one released
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and builds the unsigned APK. No secrets, no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The release job checks the APK it signs against this; another job cannot change a job's output
    outputs:
      apk_sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: bash .github/check-version.sh "$EVENT" "$REF" "$REPO"

      - name: Check the Gradle version and checksum
        run: |
          P=gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.14.3-bin.zip' "$P" || { echo "::error::$P must name the same Gradle as this workflow (8.14.3)"; exit 1; }
          WANT="$(curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256)"
          grep -q "^distributionSha256Sum=$WANT$" "$P" || { echo "::error::$P checksum differs from Gradle's: $WANT"; exit 1; }

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # A release is built from scratch, without anything cached by earlier runs
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
          cache-disabled: ${{ github.event_name == 'push' }}

      - name: Test and build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          # Every library is checked against gradle/verification-metadata.xml (refreshed only by deps.yml);
          # the build fails on any changed library, and without the file.
          test -f gradle/verification-metadata.xml || { echo "gradle/verification-metadata.xml is missing" | tee build.log; exit 1; }
          gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease 2>&1 | tee build.log

      - name: Check permissions (only what is expected)
        run: bash .github/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Check the manifest (no backups, no plain HTTP, not debuggable, nothing open to other apps)
        run: bash .github/check-manifest.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Record the APK checksum
        id: sum
        run: echo "sha256=$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 build.log | head -300; echo ----; tail -150 build.log; cat permissions.txt 2>/dev/null; } > log/build.log || true
          find app/build/test-results -name "*.xml" -exec cp {} log/ \; 2>/dev/null || true
          cp app/build/reports/lint-results-release.txt log/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log
          path: log/
          retention-days: 14

      # Pictures of the screens drawn by the tests with made-up data, for review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screens
          path: app/build/screens/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komora-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      # To read crash traces from the shrunk (R8) build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komora-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

  # Puts the screen pictures on the ci-screens branch, to look at them without downloading anything.
  # Runs no project code; only for this repository's own branches (never for pull requests from forks).
  screens:
    needs: build
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-screens
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: screens
          path: screens
      - name: Push the pictures
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -d screens ] && ls screens/*.png >/dev/null 2>&1 || { echo "No pictures"; exit 0; }
          mkdir push && cp screens/*.png push/ && cd push
          git init -q && git checkout -q -b ci-screens && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screens for ${SHA:0:7}"
          # A dropped connection: try again, and never fail a build over pictures
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}" ci-screens && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not push the pictures"

  # Prepares the release as a draft with the unsigned APK. Nothing is signed here and no key is ever
  # on GitHub: the owner signs on her own computer with scripts/sign-release.sh, which checks this
  # very file, signs it, uploads it and publishes the release. A draft is seen by nobody else.
  draft:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      # GitHub's signed record of which workflow built the file, checked by scripts/sign-release.sh
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            version.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: komora-unsigned
          path: unsigned

      - name: Check it is the APK the build made
        env:
          SUM: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          [[ "$SUM" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No APK checksum from the build"; exit 1; }
          echo "$SUM  unsigned/app-release-unsigned.apk" | sha256sum -c -

      - name: Check permissions and manifest again
        run: |
          bash .github/check-permissions.sh unsigned/app-release-unsigned.apk
          bash .github/check-manifest.sh unsigned/app-release-unsigned.apk

      - name: Name the file
        run: mv unsigned/app-release-unsigned.apk "komora-$(tr -d '[:space:]' < version.txt)-unsigned.apk"

      # Only this job (no Gradle, no project code) can make the record
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: komora-*-unsigned.apk

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUM: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          bash .github/check-version.sh push refs/heads/main "$REPO"
          V="$(tr -d '[:space:]' < version.txt)"
          # Older drafts of the same version (from earlier runs) are replaced; an error stops the job
          IDS="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"v$V\") | .id")"
          for id in $IDS; do gh api -X DELETE "repos/$REPO/releases/$id"; done
          cp .github/release-notes.md notes.md
          # Read by the signing script: the unsigned file must be exactly the one this build made
          printf '\n<!-- unsigned-sha256: %s -->\n' "$SUM" >> notes.md
          gh release create "v$V" "komora-$V-unsigned.apk" --draft \
            --repo "$REPO" --target "${{ github.sha }}" \
            --title "Komora $V" --notes-file notes.md
          echo "Draft v$V is ready: sign it with scripts/sign-release.sh $V" >> "$GITHUB_STEP_SUMMARY"
